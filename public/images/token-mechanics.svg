<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0a0c10"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#12161f" stroke="#2b3347" stroke-width="2"/>
  <text x="50" y="65" fill="#f8fafc" font-family="'Geist Sans', -apple-system, sans-serif" font-weight="700" font-size="22">StripChat Token Architecture: Client vs. Server Verification</text>
  <text x="50" y="92" fill="#94a3b8" font-family="'Geist Sans', -apple-system, sans-serif" font-size="14">Why local hacks, memory editors, and mod APKs fail against server-side transaction ledgers</text>
  
  <!-- Client Box -->
  <rect x="50" y="130" width="200" height="240" rx="8" fill="#181d28" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="165" fill="#93c5fd" font-family="'Geist Sans', -apple-system, sans-serif" font-weight="700" font-size="16">User Device (Client)</text>
  <text x="70" y="195" fill="#cbd5e1" font-family="'Geist Sans', -apple-system, sans-serif" font-size="13">• Web Browser / App</text>
  <text x="70" y="225" fill="#cbd5e1" font-family="'Geist Sans', -apple-system, sans-serif" font-size="13">• Displays Token Count</text>
  <text x="70" y="255" fill="#cbd5e1" font-family="'Geist Sans', -apple-system, sans-serif" font-size="13">• Sends Tip Requests</text>
  <rect x="70" y="295" width="160" height="50" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444"/>
  <text x="150" y="325" fill="#fca5a5" font-family="'Geist Sans', -apple-system, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Mod APK Alterations</text>
  <text x="150" y="338" fill="#fca5a5" font-family="'Geist Sans', -apple-system, sans-serif" font-size="11" text-anchor="middle">(Cosmetic Only / Fake)</text>

  <!-- Encrypted Pipeline -->
  <line x1="260" y1="240" x2="520" y2="240" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="530,240 518,234 518,246" fill="#3b82f6"/>
  <rect x="310" y="200" width="160" height="40" rx="6" fill="#1c2230" stroke="#2b3347"/>
  <text x="390" y="225" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="12" text-anchor="middle">HTTPS / WSS (Auth Token)</text>

  <!-- Server Box -->
  <rect x="540" y="130" width="210" height="240" rx="8" fill="#181d28" stroke="#10b981" stroke-width="2"/>
  <text x="560" y="165" fill="#a7f3d0" font-family="'Geist Sans', -apple-system, sans-serif" font-weight="700" font-size="16">Platform Core Server</text>
  <text x="560" y="195" fill="#cbd5e1" font-family="'Geist Sans', -apple-system, sans-serif" font-size="13">• Authoritative Database</text>
  <text x="560" y="225" fill="#cbd5e1" font-family="'Geist Sans', -apple-system, sans-serif" font-size="13">• Balance Ledger Check</text>
  <text x="560" y="255" fill="#cbd5e1" font-family="'Geist Sans', -apple-system, sans-serif" font-size="13">• Model Payout Matching</text>
  <rect x="560" y="295" width="170" height="50" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
  <text x="645" y="325" fill="#a7f3d0" font-family="'Geist Sans', -apple-system, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Validates Every Credit</text>
  <text x="645" y="338" fill="#a7f3d0" font-family="'Geist Sans', -apple-system, sans-serif" font-size="11" text-anchor="middle">Rejects Unfunded Tips</text>
  
  <text x="50" y="405" fill="#64748b" font-family="'Geist Sans', -apple-system, sans-serif" font-size="12">Figure 1.1: Cryptographic authentication ensures client modifications cannot credit server-side token balances.</text>
</svg>
